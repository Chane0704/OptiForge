[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optiforge"
version = "0.1.0"
description = "Universal software performance and efficiency optimization engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OptiForge Team"}
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "psutil>=5.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
optiforge = "optiforge.cli:main"
optiforge-app = "optiforge.app.main:launch_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["optiforge*"]

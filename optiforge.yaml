# OptiForge Default Configuration
version: "1.0"

general:
  safety_level: "safe"       # safe | balanced | aggressive
  default_dry_run: true
  backup_dir: ".optiforge/backups"
  quarantine_dir: ".optiforge/quarantine"

thresholds:
  cpu_hot_percent: 75.0      # CPU % considered hot loop
  cpu_idle_high_percent: 15.0 # CPU % considered excessive idle
  memory_leak_growth_mb: 20.0 # Memory growth threshold (MB)
  oversized_asset_kb: 500    # Asset size threshold (KB)
  slow_ttfb_ms: 600          # TTFB threshold (ms)
  large_bundle_kb: 300       # JavaScript bundle threshold (KB)

ignore:
  paths:
    - "node_modules/**"
    - ".git/**"
    - "venv/**"
    - ".venv/**"
    - "__pycache__/**"
    - "dist/**"
    - "build/**"
    - ".optiforge/**"
  packages:
    - "wheel"
    - "setuptools"
    - "pip"

plugins:
  system_profiler:
    enabled: true
    sampling_duration_sec: 2.0
    sampling_interval_sec: 0.2
  website_analyzer:
    enabled: true
    timeout_sec: 10
  compressor:
    enabled: true
    webp_quality: 80
    avif_quality: 75
    minify_js: true
    minify_css: true
  waste_finder:
    enabled: true
    check_unused_deps: true
    check_dead_code: true
    check_duplicates: true
